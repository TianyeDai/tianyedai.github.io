<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Source Dataset — Video Game Sales</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css">
    <style>
        :root {
            --bg-dark: #0a0e27;
            --bg-mid: #151a35;
            --text-primary: #e8eaf6;
            --text-secondary: #9fa8da;
            --glow: rgba(159, 168, 218, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-mid) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 5%;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(155, 89, 182, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(52, 152, 219, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }
        .nav-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 1.1rem;
            margin-bottom: 25px;
            transition: color 0.2s;
            letter-spacing: 0.05em;
        }
        .nav-link:hover { color: #fff; }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.6rem, 3vw, 2.8rem);
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px var(--glow);
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            margin-bottom: 30px;
        }
        .subtitle a { color: var(--text-secondary); text-decoration: underline; text-underline-offset: 3px; }
        .subtitle a:hover { color: #fff; }
        #grid-wrapper {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(159, 168, 218, 0.15);
            border-radius: 12px;
            padding: 20px;
        }
        #loading { text-align: center; padding: 60px; color: var(--text-secondary); font-size: 1.2rem; }

        /* Grid.js dark theme overrides */
        .gridjs-wrapper { background: transparent !important; box-shadow: none !important; border: none !important; }
        .gridjs-container { color: var(--text-primary); font-family: 'Rajdhani', sans-serif; }
        .gridjs-table { background: transparent; }
        .gridjs-th {
            background: rgba(102, 126, 234, 0.15) !important;
            color: var(--text-primary) !important;
            border-color: rgba(159, 168, 218, 0.25) !important;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .gridjs-td {
            background: transparent !important;
            color: var(--text-primary) !important;
            border-color: rgba(159, 168, 218, 0.12) !important;
        }
        .gridjs-tr:hover .gridjs-td { background: rgba(255,255,255,0.04) !important; }
        .gridjs-search-input, .gridjs-input {
            background: rgba(255,255,255,0.05) !important;
            color: var(--text-primary) !important;
            border: 1px solid rgba(159, 168, 218, 0.3) !important;
        }
        .gridjs-search-input::placeholder { color: rgba(159, 168, 218, 0.6) !important; }
        .gridjs-pagination { color: var(--text-secondary) !important; }
        .gridjs-pagination .gridjs-pages button {
            background: rgba(255,255,255,0.05) !important;
            color: var(--text-primary) !important;
            border-color: rgba(159, 168, 218, 0.2) !important;
        }
        .gridjs-pagination .gridjs-pages button:hover:not(:disabled) { background: rgba(255,255,255,0.1) !important; }
        .gridjs-pagination .gridjs-pages button:disabled { opacity: 0.4; }
        .gridjs-pagination .gridjs-pages button.gridjs-currentPage {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border-color: transparent !important;
            color: #fff !important;
        }
        .gridjs-summary { color: var(--text-secondary) !important; }
        .gridjs-sort { filter: invert(0.85); }
        .gridjs-footer, .gridjs-head { background: transparent !important; box-shadow: none !important; border: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <a href="hexagons.html" class="nav-link">&larr; Back to visualization</a>
        <h1>Source Dataset</h1>
        <p class="subtitle">
            Video game sales &middot;
            <a href="data/vgsales_clean.csv" download>download CSV</a>
        </p>
        <div id="grid-wrapper">
            <div id="loading">Loading dataset&hellip;</div>
            <div id="grid"></div>
        </div>
    </div>

    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script>
        Papa.parse('data/vgsales_clean.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                document.getElementById('loading').style.display = 'none';
                const cols = results.meta.fields;
                const data = results.data.map(row => cols.map(c => row[c] ?? ''));
                new gridjs.Grid({
                    columns: cols.map(c => ({ name: c, sort: true })),
                    data: data,
                    search: true,
                    sort: true,
                    pagination: { limit: 50, summary: true },
                    resizable: true,
                    style: {
                        table: { 'white-space': 'nowrap' }
                    }
                }).render(document.getElementById('grid'));
            },
            error: function(err) {
                document.getElementById('loading').textContent = 'Failed to load dataset: ' + err.message;
            }
        });
    </script>
</body>
</html>
